codecov:
  branch: dev
coverage:
  status:
    project:
      default:
        informational: true   # Show as informational, does not block PRs
        target: auto          # Automatically determines target coverage
        threshold: "1"        # Allows for a 1% drop without failing
        paths:
          - custom_components/sax_battery/
      required:
        target: 80            # Require 80% coverage for this project
        threshold: 1          # Allow up to 1% drop before failing
        paths:
          - custom_components/sax_battery/
    patch:
      default:
        informational: false  # Mark patches as failing if coverage is not met
        target: 100           # Patch coverage needs to be perfect
        threshold: 0
        paths:
          - custom_components/sax_battery/

comment:
  layout: "reach, diff, flags, files"
  behavior: default

ignore:
  - "tests/"
  - "**/test_*.py"
  - "**/__init__.py"

parsers:
  python:
    target: "custom_components/sax_battery/"

github_checks:
  annotations: true

# Optionally: If you use coverage.py for Python, you can set this to ensure recognition.
coverage:
  precision: 2
  round: down
  range: "90...100"
  notify:
    after_n_builds: 1

# Optionally: Carry forward flags from partial CI builds
flag_management:
  default_rules:
    carryforward: true
